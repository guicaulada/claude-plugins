name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  detect-plugins:
    name: Detect changed plugins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go-plugins: ${{ steps.detect.outputs.go-plugins }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed Go plugins
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # All Go plugins in the repo
          all_plugins=$(find plugins -name "go.mod" -exec dirname {} \; | sort)

          # Determine changed files
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed=$(git diff --name-only "$PR_BASE_SHA" "$HEAD_SHA" || echo "")
          else
            changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          fi

          # Check if shared files changed (CI, root config) — run all plugins
          shared_changed=false
          echo "$changed" | grep -qE '^\.github/|^\.claude-plugin/|^release-please' && shared_changed=true

          if [ "$shared_changed" = "true" ] || [ -z "$changed" ]; then
            # Shared files changed or can't determine diff — test all plugins
            plugins="$all_plugins"
            echo "Running all plugins (shared files changed or initial push)"
          else
            # Only test plugins with changed files
            plugins=""
            for plugin in $all_plugins; do
              if echo "$changed" | grep -q "^${plugin}/"; then
                plugins="$plugins $plugin"
              fi
            done
          fi

          # Convert to JSON array
          json=$(echo "$plugins" | xargs -n1 | sort -u | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "go-plugins=$json" >> "$GITHUB_OUTPUT"
          echo "Changed Go plugins: $json"

  test-go:
    name: Test Go plugin
    needs: detect-plugins
    if: needs.detect-plugins.outputs.go-plugins != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        plugin: ${{ fromJson(needs.detect-plugins.outputs.go-plugins) }}
    defaults:
      run:
        working-directory: ${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: ${{ matrix.plugin }}/go.mod

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: latest
          working-directory: ${{ matrix.plugin }}

      - name: Test
        run: go test -race ./...

      - name: Build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/handler

  build-go:
    name: Build Go plugin
    needs: detect-plugins
    if: needs.detect-plugins.outputs.go-plugins != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        plugin: ${{ fromJson(needs.detect-plugins.outputs.go-plugins) }}
        target:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    defaults:
      run:
        working-directory: ${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: ${{ matrix.plugin }}/go.mod

      - name: Build ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: go build -ldflags "-s -w" -o "handler-${GOOS}-${GOARCH}" ./cmd/handler
